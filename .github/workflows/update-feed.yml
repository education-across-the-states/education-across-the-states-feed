name: Update Umbrella Feed

on:
  schedule:
    - cron: '20 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-umbrella-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Rebuild feed.xml from upstream
        run: |
          python3 - <<'PYEOF'
          import os, re, urllib.request

          UPSTREAM = "https://muse.ai/podcasts/feed/1337692426099284/ac5626cf-254c-4fb4-b4a4-7aa3dd422fa5"
          PROXY_BASE = "https://education-across-the-states.github.io/education-across-the-states-feed"
          AUTHOR = "Professional Development Inc"
          OWNER_EMAIL = "educationacrossthestates@gmail.com"
          CATEGORY = "Education"
          # Excluded GUIDs: add a GUID here to pull an episode out of the public feed
          # (used when a corrected "Revised" edition replaces an original).
          EXCLUDED_GUIDS = [
              "ep-2abaecb8-8c85-4f75-b270-d3d32b24e28f",  # 2026-10-19: defective NM launch (two ~20s voice dropouts); replaced by revised ep-f8f4731a-9592-4c4b-8b8b-0d8c341445d0
              "ep-1a035f9b",  # defective AR original (full GUID on file in the sync-discipline notes); replaced by corrected edition
          ]

          req = urllib.request.Request(UPSTREAM, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=60) as resp:
              feed = resp.read().decode("utf-8")
              # Remove any <item> block whose <guid> contains an excluded GUID.
              def _remove_excluded_items(xml):
                  def _keep(match):
                      guid_match = re.search(r"<guid[^>]*>(.*?)</guid>", match.group(0), flags=re.S)
                      if guid_match and any(excluded in guid_match.group(1) for excluded in EXCLUDED_GUIDS):
                          return ""
                      return match.group(0)
                  return re.sub(r"<item>.*?</item>", _keep, xml, flags=re.S)

              feed = _remove_excluded_items(feed)

          feed = re.sub(r"\s*<itunes:author>.*?</itunes:author>", "", feed, flags=re.S)
          feed = re.sub(r"\s*<itunes:category[^/]*/>", "", feed)
          feed = re.sub(r"\s*<itunes:category[^>]*>.*?</itunes:category>", "", feed, flags=re.S)
          feed = re.sub(r"\s*<itunes:owner>.*?</itunes:owner>", "", feed, flags=re.S)

          tags = (
              f"\n    <itunes:author>{AUTHOR}</itunes:author>"
              f'\n    <itunes:category text="{CATEGORY}" />'
              f"\n    <itunes:owner>\n      <itunes:name>{AUTHOR}</itunes:name>"
              f"\n      <itunes:email>{OWNER_EMAIL}</itunes:email>\n    </itunes:owner>"
          )
          feed, n = re.subn(r"(<language>[^<]*</language>)", r"\1" + tags, feed, count=1)
          if n == 0:
              raise SystemExit("anchor <language> tag not found")

          self_url = PROXY_BASE.rstrip("/") + "/feed.xml"
          feed = re.sub(
              r'(<atom:link href=")[^"]*(" rel="self")',
              r"\g<1>" + self_url + r"\g<2>",
              feed,
              count=1,
          )

          def guids(text):
              return set(re.findall(r"<guid[^>]*>(.*?)</guid>", text))

          old_guids = guids(open("feed.xml", encoding="utf-8").read()) if os.path.exists("feed.xml") else set()
          new_guids = guids(feed)
          if old_guids == new_guids and old_guids:
              print(f"no change ({len(new_guids)} episodes)")
          else:
              with open("feed.xml", "w", encoding="utf-8") as f:
                  f.write(feed)
              print(f"updated feed.xml ({len(new_guids)} episodes)")
          PYEOF

      - name: Rebuild educacion/feed.xml from upstream (Spanish flagship)
        run: |
          python3 - <<'PYEOF'
          import os, re, urllib.request

          UPSTREAM = "https://muse.ai/podcasts/feed/1337692426099284/723356ab-bdbc-4b30-96b8-2a8971d748be"
          MIRROR_URL = "https://education-across-the-states.github.io/education-across-the-states-feed/educacion/feed.xml"
          AUTHOR = "Charles Mayfield"
          OWNER_EMAIL = "educationacrossthestates@gmail.com"
          CATEGORY = "Education"
          LANGUAGE = "es"
          OUT = "educacion/feed.xml"

          req = urllib.request.Request(UPSTREAM, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=60) as resp:
              feed = resp.read().decode("utf-8")

          # The Muse template carries no channel owner/managingEditor email, and
          # Amazon/Deezer validate the email inside the feed itself. Inject the
          # network's monitored contact metadata into the channel header only;
          # items, GUIDs and enclosures pass through untouched.
          head, sep, rest = feed.partition("<item>")
          if not sep:
              raise SystemExit("no <item> found in Spanish upstream feed")
          head = re.sub(r"\s*<itunes:author>.*?</itunes:author>", "", head, flags=re.S)
          head = re.sub(r"\s*<itunes:category[^/]*/>", "", head)
          head = re.sub(r"\s*<itunes:category[^>]*>.*?</itunes:category>", "", head, flags=re.S)
          head = re.sub(r"\s*<itunes:owner>.*?</itunes:owner>", "", head, flags=re.S)
          head = re.sub(r"\s*<managingEditor>.*?</managingEditor>", "", head, flags=re.S)
          # Apple requires channel itunes:author + itunes:category; the
          # upstream template also mislabels this Spanish show as "en" and
          # points atom:self at the raw Muse feed. Fix all at channel level.
          head, n = re.subn(r"<language>[^<]*</language>", f"<language>{LANGUAGE}</language>", head, count=1)
          if n == 0:
              raise SystemExit("anchor <language> tag not found")
          tags = (
              f"\n  <itunes:author>{AUTHOR}</itunes:author>"
              f'\n  <itunes:category text="{CATEGORY}" />'
              f"\n  <itunes:owner>\n    <itunes:name>{AUTHOR}</itunes:name>"
              f"\n    <itunes:email>{OWNER_EMAIL}</itunes:email>\n  </itunes:owner>"
              f"\n  <managingEditor>{OWNER_EMAIL} ({AUTHOR})</managingEditor>"
          )
          head = re.sub(r"(<language>[^<]*</language>)", r"\1" + tags, head, count=1)
          head, n = re.subn(
              r'(<atom:link href=")[^"]*(" rel="self")',
              r"\g<1>" + MIRROR_URL + r"\g<2>",
              head,
              count=1,
          )
          if n == 0:
              raise SystemExit("anchor atom:link rel=self not found")
          feed = head + sep + rest

          def guids(text):
              return set(re.findall(r"<guid[^>]*>(.*?)</guid>", text))

          # Compare full content, not just GUIDs: a GUID-only check would
          # silently drop channel-metadata fixes (author/category/language)
          # whenever the episode set is unchanged.
          old_text = open(OUT, encoding="utf-8").read() if os.path.exists(OUT) else ""
          if old_text == feed:
              print(f"spanish feed unchanged ({len(guids(feed))} episodes)")
          else:
              os.makedirs(os.path.dirname(OUT), exist_ok=True)
              with open(OUT, "w", encoding="utf-8") as f:
                  f.write(feed)
              print(f"updated educacion/feed.xml ({len(guids(feed))} episodes)")
          PYEOF

      - name: Rebuild per-state index pages
        run: |
          python3 build-index.py

      - name: Commit and push if changed
        run: |
          git config user.name "podcast-feed-bot"
          git config user.email "podcast-feed-bot@users.noreply.github.com"
          git add feed.xml index.html *.html educacion/feed.xml
          if git diff --cached --quiet; then
            echo "feed and index pages unchanged, nothing to commit"
          else
            git commit -m "Update umbrella feed and state index pages"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
